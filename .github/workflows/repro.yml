name: Repro

on:
  schedule:
    - cron: "23 4 * * 1"   # weekly, Monday 04:23 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repro
  cancel-in-progress: false

jobs:
  repro:
    name: Reproducible WASM + Python artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          targets: wasm32-unknown-unknown

      - name: Python build tooling
        run: python3 -m pip install --upgrade build

      - name: WASM reproducibility
        run: bash scripts/repro_wasm.sh

      - name: Python reproducibility
        run: bash scripts/repro_python.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repro-reports
          path: |
            reports/repro_wasm.json
            reports/repro_python.json
          if-no-files-found: warn
          retention-days: 30

  exe:
    name: Reproducible Windows EXE
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build twice and compare
        run: node scripts/repro_exe.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repro-exe-report
          path: reports/repro_exe.json
          if-no-files-found: warn
          retention-days: 30
