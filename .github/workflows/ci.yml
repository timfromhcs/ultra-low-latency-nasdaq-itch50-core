name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rtl:
    name: RTL + formal + model
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          export DEBIAN_FRONTEND=noninteractive
          # apt mirrors on the runners have hung for >5 min twice today (exit 124).
          # Only install what is missing, retry the index update, and bound every call.
          need=""
          for t in verilator yosys iverilog z3; do
            command -v "$t" >/dev/null 2>&1 || need="$need $t"
          done
          if [ -n "$need" ]; then
            for i in 1 2 3; do
              if timeout 240 sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update -qq; then break; fi
              echo "apt-get update attempt $i failed"
              sudo rm -rf /var/lib/apt/lists/* || true
              sleep 5
            done
            timeout 900 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y -qq $need python3-pip
          fi
          # cvc5 is optional for the CI proof (Z3 is the required solver)
          timeout 180 sudo apt-get -o Acquire::http::Timeout=20 install -y -qq cvc5 || true
      - name: Python deps
        run: |
          python3 -m pip install --break-system-packages --upgrade pip
          python3 -m pip install --break-system-packages cocotb pytest scapy
      - name: Lint
        run: make lint
      - name: Vectors (50k for CI time)
        run: python3 tb/itch_model.py --count 50000 --out tb/vectors
      - name: Full-field regression
        run: make sim VECTORS=tb/vectors
      - name: Model tests
        run: python3 -m pytest -q tb/test_model.py
      - name: Cocotb
        run: |
          python3 tb/run_cocotb.py
          python3 tb/run_pipeline_cocotb.py
          python3 tb/run_multi_cocotb.py
          python3 tb/run_book_cocotb.py
          python3 tb/run_book_top_cocotb.py
          python3 tb/run_book_top_skid_cocotb.py
          python3 tb/run_arbiter_cocotb.py
          python3 tb/run_ab_system_cocotb.py
          python3 tb/run_recovery_cocotb.py 
          python3 tb/run_metrics_cocotb.py  
          python3 tb/run_snapshot_cocotb.py 
          python3 tb/run_host_wrap_cocotb.py 
          python3 tb/run_wishbone_cocotb.py  
          python3 tb/run_wishbone32_cocotb.py
          python3 tb/run_caravel_cocotb.py   
          python3 tb/run_book_snapshot_cocotb.py
          python3 tb/run_caravel_upw_cocotb.py
          python3 tb/run_skid_cocotb.py     

  wasm-web:
    name: WASM + backend + MCP + Vercel
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build WASM
        run: |
          cd wasm-core && cargo build --target wasm32-unknown-unknown --release
          cp target/wasm32-unknown-unknown/release/chiplab_core.wasm ../web/wasm/chiplab_core.wasm
      - name: Python test deps
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip pytest
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Gate
        run: node scripts/gate.mjs

  docker:
    name: Docker build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t chiplab:ci .

  packages:
    name: npm + PyPI artifacts
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: npm pack
        run: cd packages/npm && npm pack
      - name: Python build
        run: |
          python -m pip install build
          cd packages/python && python -m build
