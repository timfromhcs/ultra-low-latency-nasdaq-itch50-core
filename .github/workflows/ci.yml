name: CI Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Hardware Toolchains
        run: |
          sudo apt-get update -y
          sudo apt-get install -y yosys iverilog verilator z3 python3-pip

      - name: Setup Python Virtualenv and Dependencies
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install cocotb cocotb-tools pytest scapy wavedrom klayout

      - name: Run Complete Verification Suite
        run: |
          make verify_all