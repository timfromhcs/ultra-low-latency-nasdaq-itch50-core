name: Formal

on:
  schedule:
    - cron: "17 3 * * 1"   # weekly, Monday 03:17 UTC
  workflow_dispatch:

jobs:
  formal:
    name: SymbiYosys / Z3 deep proof
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq yosys z3 python3-pip
          sudo apt-get install -y -qq cvc5 || true
      - name: Deep proof (BMC 20 + k-induction + covers)
        run: ./formal/run_formal.sh z3
      - name: Solver matrix (best effort)
        run: ./formal/solver_matrix.sh || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: formal-reports
          path: |
            reports/formal.json
            reports/formal_*.log

  mutation:
    name: Mutation (parser -> BBO)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq iverilog python3-pip
          python3 -m pip install --break-system-packages cocotb pytest
      - name: Mutation score
        run: python3 tools/mutate_book.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: reports/mutation_book.json
