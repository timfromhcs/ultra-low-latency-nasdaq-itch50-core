name: Formal

on:
  schedule:
    - cron: "17 3 * * 1"   # weekly, Monday 03:17 UTC
  workflow_call:
  workflow_dispatch:
    inputs:
      solver_matrix:
        description: "Run every available solver (slow)"
        type: boolean
        default: false

jobs:
  formal:
    name: SymbiYosys / Z3 deep proof
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Cache oss-cad-suite
        id: oss
        uses: actions/cache@v4
        with:
          path: /opt/oss-cad-suite
          key: oss-cad-suite-2026-11-03
      - name: Toolchain (pinned oss-cad-suite)
        if: steps.oss.outputs.cache-hit != 'true'
        run: |
          # Pin Yosys + Z3 to one known-good bundle; Ubuntu's older packages
          # produced a spurious counterexample in the deep proof.
          curl -fsSL -o /tmp/oss.tgz \
            https://github.com/YosysHQ/oss-cad-suite-build/releases/download/2026-11-03/oss-cad-suite-linux-x64-20261103.tgz
          tar -xzf /tmp/oss.tgz -C /opt
      - name: Add toolchain to PATH
        run: |
          echo "/opt/oss-cad-suite/bin" >> "$GITHUB_PATH"
          /opt/oss-cad-suite/bin/yosys -V
          /opt/oss-cad-suite/bin/z3 --version || true
      - name: Deep proof (BMC 20 + k-induction + covers)
        run: ./formal/run_formal.sh z3
      - name: Solver matrix (opt-in, capped)
        if: github.event_name == 'workflow_dispatch' && inputs.solver_matrix
        timeout-minutes: 20
        continue-on-error: true
        run: ./formal/solver_matrix.sh || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: formal-reports
          path: |
            reports/formal.json
            reports/formal_*.log

  mutation:
    name: Mutation (parser -> BBO)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq iverilog python3-pip
          python3 -m pip install --break-system-packages cocotb pytest
      - name: Mutation score
        run: python3 tools/mutate_book.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-report
          path: reports/mutation_book.json

  equivalence:
    name: RTL vs WASM equivalence
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq verilator python3-pip make g++
      - name: Generate vectors
        run: python3 tb/itch_model.py --count 100000 --out tb/vectors
      - name: RTL vs WASM
        run: node scripts/rtl_wasm_equiv.mjs --run
